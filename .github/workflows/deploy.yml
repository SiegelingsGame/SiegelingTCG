name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy-cloud-run:
    name: Cloud Run Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend To Cloud Run
        run: |
          gcloud run deploy sieglings-tcg-api \
            --source . \
            --region us-central1 \
            --project siegelingstcgtesting \
            --quiet

  deploy-firebase:
    name: Firebase Deploy
    needs: deploy-cloud-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions Dependencies
        run: npm ci --prefix functions

      - name: Validate Functions Source
        run: npm --prefix functions run lint

      - name: Generate Functions Manifest
        run: npm --prefix functions run manifest

      - name: Deploy Firebase Hosting And Functions
        # `firebase deploy` occasionally fails at startup with a transient
        # "Failed to authenticate" while picking up the GitHub Actions ADC
        # credentials. Retry a few times so a one-off auth hiccup doesn't fail
        # the whole deploy (re-running deploy is idempotent).
        run: |
          for attempt in 1 2 3; do
            echo "::group::firebase deploy (attempt $attempt/3)"
            if firebase deploy --only functions:api,hosting --project siegelingstcgtesting; then
              echo "::endgroup::"
              echo "Firebase deploy succeeded on attempt $attempt."
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 20s..."
              sleep 20
            fi
          done
          echo "Firebase deploy failed after 3 attempts."
          exit 1
