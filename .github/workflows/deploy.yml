name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy-cloud-run:
    name: Cloud Run Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend To Cloud Run
        run: |
          # Match state (solo games in GameService.soloGames, multiplayer rooms
          # in MultiplayerService.rooms) lives only in one JVM's memory. Default
          # Cloud Run autoscaling load-balances requests across many instances
          # that also scale to zero between calls, so a game started on one
          # instance vanishes when the next action lands on another — surfacing
          # as "No active game. Start a new game first." mid-match. Pin the
          # service to a single always-warm instance so every request hits the
          # same in-memory store. min-instances=1 also removes the 10-30s cold
          # start on /api/game/new.
          gcloud run deploy sieglings-tcg-api \
            --source . \
            --region us-central1 \
            --project siegelingstcgtesting \
            --min-instances 1 \
            --max-instances 1 \
            --quiet

  deploy-firebase:
    name: Firebase Deploy
    needs: deploy-cloud-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions Dependencies
        run: npm ci --prefix functions

      - name: Validate Functions Source
        run: npm --prefix functions run lint

      - name: Generate Functions Manifest
        run: npm --prefix functions run manifest

      - name: Write Firebase service account credentials
        # firebase-tools (v15) does not honor the credential file that
        # google-github-actions/auth exports — it ignores ADC and fails with
        # "Failed to authenticate, have you run firebase login?" (see
        # firebase/firebase-tools#10726). gcloud accepts that file, which is why
        # the Cloud Run job authenticates fine. Write the raw service-account
        # key to its own file and point firebase-tools straight at it below.
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy Firebase Hosting
        # Hosting is deployed on its own so a functions deploy failure can never
        # block the hosting release. A stuck functions:api operation returning
        # HTTP 409 previously aborted the combined deploy before hosting was
        # released, leaving the site serving stale content despite a "success".
        # Point firebase-tools at the raw service-account key (a format it can
        # authenticate with), overriding the ADC file for this step only. Retry
        # to ride out genuinely transient network/API errors; deploy is
        # idempotent so retries are safe.
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase --version || true
          backoffs="20 40 60"
          attempt=0
          for wait in 0 $backoffs; do
            if [ "$wait" -gt 0 ]; then
              echo "Retrying in ${wait}s..."
              sleep "$wait"
            fi
            attempt=$((attempt + 1))
            echo "::group::firebase deploy hosting (attempt $attempt)"
            set +e
            output="$(firebase deploy --only hosting --project siegelingstcgtesting 2>&1)"
            code=$?
            set -e
            echo "$output"
            echo "::endgroup::"
            if [ "$code" -eq 0 ]; then
              echo "Firebase hosting deploy succeeded on attempt $attempt."
              exit 0
            fi
            # A commit that touches only functions/** leaves the hosting content
            # byte-identical to the live version. Firebase then rejects the
            # release with HTTP 400 "is the current active version". There is
            # nothing to release — treat it as a successful no-op so it does not
            # abort the job before the functions deploy below.
            if printf '%s' "$output" | grep -q "is the current active version"; then
              echo "Hosting content unchanged (version already live). Treating as success."
              exit 0
            fi
            echo "Attempt $attempt failed."
          done
          echo "Firebase hosting deploy failed after $attempt attempts."
          exit 1

      - name: Deploy Firebase Functions
        # Functions deploy is best-effort: a stuck function operation (HTTP 409)
        # must not fail the pipeline or block the hosting release above. Marked
        # continue-on-error and surfaced as a warning so it stays visible.
        # `if: !cancelled()` makes this run even when the hosting step above
        # failed (e.g. a hosting no-op or transient error) so a functions-only
        # change can still ship — hosting and functions are independent.
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          backoffs="20 40 60"
          attempt=0
          for wait in 0 $backoffs; do
            if [ "$wait" -gt 0 ]; then
              echo "Retrying in ${wait}s..."
              sleep "$wait"
            fi
            attempt=$((attempt + 1))
            echo "::group::firebase deploy functions (attempt $attempt)"
            if firebase deploy --only functions:api --project siegelingstcgtesting; then
              echo "::endgroup::"
              echo "Firebase functions deploy succeeded on attempt $attempt."
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed."
          done
          echo "::warning::Firebase functions deploy failed after $attempt attempts (hosting was still released)."
          exit 1
