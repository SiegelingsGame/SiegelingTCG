name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy-cloud-run:
    name: Cloud Run Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend To Cloud Run
        run: |
          gcloud run deploy sieglings-tcg-api \
            --source . \
            --region us-central1 \
            --project siegelingstcgtesting \
            --quiet

  deploy-firebase:
    name: Firebase Deploy
    needs: deploy-cloud-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions Dependencies
        run: npm ci --prefix functions

      - name: Validate Functions Source
        run: npm --prefix functions run lint

      - name: Generate Functions Manifest
        run: npm --prefix functions run manifest

      - name: Deploy Firebase Hosting And Functions
        run: firebase deploy --only functions:api,hosting --project siegelingstcgtesting
