name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Deploy frontend to Firebase Hosting
  # ──────────────────────────────────────────────
  deploy-frontend:
    name: Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: siegelingstcgtesting

  # ──────────────────────────────────────────────
  # Job 2: Build and deploy backend to Cloud Run
  # ──────────────────────────────────────────────
  deploy-backend:
    name: Cloud Run
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: siegelingstcgtesting
      REGION: us-central1
      SERVICE: sieglings-tcg-api
      IMAGE: us-central1-docker.pkg.dev/siegelingstcgtesting/cloud-run-source-deploy/sieglings-tcg-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ env.IMAGE }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image "${{ env.IMAGE_TAG }}" \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --set-env-vars "APP_CORS_ALLOWED_ORIGIN_PATTERNS=https://siegelingstcgtesting.web.app,https://siegelingstcgtesting.firebaseapp.com"
