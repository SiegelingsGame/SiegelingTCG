name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy-cloud-run:
    name: Cloud Run Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend To Cloud Run
        run: |
          gcloud run deploy sieglings-tcg-api \
            --source . \
            --region us-central1 \
            --project siegelingstcgtesting \
            --quiet

  deploy-firebase:
    name: Firebase Deploy
    needs: deploy-cloud-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions Dependencies
        run: npm ci --prefix functions

      - name: Validate Functions Source
        run: npm --prefix functions run lint

      - name: Generate Functions Manifest
        run: npm --prefix functions run manifest

      - name: Deploy Firebase Hosting And Functions
        # `firebase deploy` intermittently fails at startup with a transient
        # "Failed to authenticate" — the Authenticate step writes valid ADC
        # credentials, but firebase-tools' OAuth token exchange flakes for a
        # job's window (confirmed: same CLI version, one run failed and a re-run
        # 17 min later succeeded). Retry with escalating backoff so a flake
        # window (which can last a few minutes) is outlasted within one job.
        # Deploy is idempotent, so retries are safe.
        run: |
          firebase --version || true
          backoffs="20 40 60 90 120"
          attempt=0
          for wait in 0 $backoffs; do
            if [ "$wait" -gt 0 ]; then
              echo "Retrying in ${wait}s..."
              sleep "$wait"
            fi
            attempt=$((attempt + 1))
            echo "::group::firebase deploy (attempt $attempt)"
            if firebase deploy --only functions:api,hosting --project siegelingstcgtesting; then
              echo "::endgroup::"
              echo "Firebase deploy succeeded on attempt $attempt."
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed."
          done
          echo "Firebase deploy failed after $attempt attempts."
          exit 1
