<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Offline — Siegelings TCG</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#0a1530">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #0a1530;
            color: #e7eefc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .offline-shell {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px;
            box-sizing: border-box;
            gap: 18px;
        }
        .offline-mark {
            width: 84px;
            height: 84px;
            border-radius: 22px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            box-sizing: border-box;
        }
        h1 { font-size: 1.5rem; margin: 0; }
        p { margin: 0; max-width: 30rem; line-height: 1.5; color: #9fb2d6; }
        button {
            margin-top: 8px;
            border: 0;
            border-radius: 12px;
            padding: 12px 22px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #0a1530;
            background: linear-gradient(135deg, #ffc24b, #ff9a3c);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="offline-shell">
        <img class="offline-mark" src="/img/siegelings-icon.png" alt="" aria-hidden="true">
        <h1>You're offline</h1>
        <p>Siegelings TCG can't reach the server right now. Pages and decks you've already opened are still cached — reconnect to jump back into the arena.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
