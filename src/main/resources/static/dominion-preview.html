<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Siegelings Dominion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/dominion.css?v=2">

<body>
<div class="dm-app" id="dmApp">
    <header class="dm-top">
        <div class="dm-top-row">
            <div class="dm-brand"><strong>Dominion</strong><span class="dm-tag">Prototype</span></div>
            <div class="dm-clock" id="dmClock"><b>—</b>local save</div>
            <button class="dm-pass" id="dmPass" type="button" title="Demo control: advances the shared clock by 4 hours">
                <span>+4h</span><small>Pass time</small>
            </button>
            <button class="dm-icon-btn" id="dmMenu" type="button" aria-label="Prototype menu">⋯</button>
        </div>
        <div class="dm-res-strip" id="dmResStrip" aria-label="Storage"></div>
    </header>

    <main class="dm-main">
        <section class="dm-view is-scene" id="view-keep" aria-label="The Keep">
            <div class="dm-scene" id="dmScene" data-hall="1" data-woodlot="1" data-archive="0" data-heal="0">
                <div class="sky-glow"></div>
                <div class="cloud cloud-one"></div>
                <div class="cloud cloud-two"></div>
                <div class="mountain mountain-back"></div>
                <div class="mountain mountain-front"></div>
                <div class="ground-layer"></div>
                <div class="wounded-earth"></div>
                <div class="restored-meadow"></div>
                <div class="river"></div>
                <div class="road"></div>
                <div class="ambient-motes" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

                <button class="building-hotspot hall-hotspot" type="button" data-building="hall" aria-label="Great Hall">

l="rgba(148,152,150,.5)"/> <rect x="188" y="110" width="10" height="100" fill="rgba(148,152,150,.5)"/> <g fill="rgba(108,112,112,.6)"><rect x="50" y="92" width="40" height="9"/><rect x="182" y="92" width="40" height="9"/></g> </g> <g class="kh-upgrade kh-lvl6"> <circle class="kh-tower-light" cx="70" cy="84" r="6"/> <circle class="kh-tower-light" cx="202" cy="84" r="6"/> </g> <g class="kh-upgrade kh-lvl7"> <rect x="136" y="8" width="3" height="18" fill="#5a4632"/> <g class="kh-banner"><polygon points="139,10 162,15 139,21" fill="url(#khBanner)"/></g> <g class="kh-banner"><polygon points="66,96 80,99 66,104" fill="url(#khBanner)"/><polygon points="208,96 222,99 208,104" fill="url(#khBanner)"/></g> </g> </svg><span class="scaffold"><b></b><b></b><b></b></span></span>
                    <span class="building-label"><strong>Great Hall</strong><small data-label="hall">Covenant Hall</small></span>
                </button>
                <button class="building-hotspot quarter-hotspot" type="button" data-building="quarter" aria-label="Elemental Quarter">
                    <span class="quarter-illustration" id="dmQuarterMini" aria-hidden="true"></span>
                    <span class="building-label"><strong>Elemental Quarter</strong><small data-label="quarter">6 workshops</small></span>
                </button>
                <button class="building-hotspot enclave-hotspot" type="button" data-building="enclave" aria-label="Siegeling Enclave">
                    <span class="enclave-illustration" aria-hidden="true"><i class="enclave-hut hut-one"></i><i class="enclave-hut hut-two"></i><i class="enclave-hearth"></i><i class="enclave-fence"></i></span>
                    <span class="building-label"><strong>Enclave</strong><small data-label="enclave">Residents rest here</small></span>
                </button>
                <button class="building-hotspot woodlot-hotspot" type="button" data-building="woodlot" aria-label="Woodlot">
                    <span class="tree-cluster" aria-hidden="true"><i></i><i></i><i></i></span>

                    <span class="building-label"><strong>Woodlot</strong><small data-label="woodlot">Timber</small></span>
                </button>
                <button class="building-hotspot archive-hotspot" type="button" data-building="archive" aria-label="Archive">
                    <span class="building-illustration" aria-hidden="true"><svg class="paper-building-shell" viewBox="0 0 220 205" preserveAspectRatio="xMidYMax meet"> <defs> <linearGradient id="arStoneF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a59e8b"/><stop offset="1" stop-color="#7f7a69"/></linearGradient> <linearGradient id="arStoneS" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6e695a"/><stop offset="1" stop-color="#565244"/></linearGradient> <linearGradient id="arRoofF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#48596b"/><stop offset="1" stop-color="#2b3b4a"/></linearGradient> <linearGradient id="arRoofS" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#243342"/><stop offset="1" stop-color="#16222e"/></linearGradient> <radialGradient id="arGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e6d9ff"/><stop offset="1" stop-color="rgba(230,217,255,0)"/></radialGradient> </defs> <ellipse class="building-contact-shadow" cx="110" cy="192" rx="88" ry="10" fill="rgba(24,32,26,.32)"/> <g class="ar-ruined"> <polygon points="96,118 112,112 112,186 96,190" fill="url(#arStoneS)"/> <polygon points="46,190 46,120 58,102 74,116 86,96 96,118 96,190" fill="url(#arStoneF)"/> <polygon points="128,190 128,126 142,104 156,122 168,108 176,128 176,190" fill="url(#arStoneF)"/> <polygon points="176,128 190,122 190,184 176,190" fill="url(#arStoneS)"/> <g stroke="rgba(70,66,54,.4)" stroke-width="1.3"> <line x1="46" y1="146" x2="96" y2="146"/><line x1="46" y1="168" x2="96" y2="168"/> <line x1="128" y1="150" x2="176" y2="150"/><line x1="128" y1="172" x2="176" y2="172"/> </g> <path d="M92 176 a24 24 0 0 1 38 -8" stroke="#8b8574" stroke-width="10" fill="none"/> <circle cx="88" cy="186" r="6" fill="#8d8877"/><circle cx="104" cy="189" r="5" fill="#767162"/> <circle cx="130" cy="187" r="7" fill="#837e6d"/><circle cx="146" cy="190" r="4.5" fill="#6d6857"/> <ellipse class="ar-glimmer" cx="112" cy="178" rx="16" ry="7" fill="url(#arGlow)                 <div id="dmSceneOverlay"></div>

        </section>
        <section class="dm-view hidden" id="view-knight" aria-label="Knight"></section>
        <section class="dm-view hidden" id="view-activities" aria-label="Activities"></section>
        <section class="dm-view hidden" id="view-companions" aria-label="Companions"></section>
    </main>

    <nav class="dm-tabs" role="tablist" aria-label="Dominion sections">
        <button class="dm-tab" role="tab" type="button" data-tab="keep" aria-selected="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 20V10l3-2v-3h2v2l3-2 3 2V5h2v3l3 2v10z"/><path d="M10 20v-5h4v5"/></svg>Keep</button>
        <button class="dm-tab" role="tab" type="button" data-tab="knight" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M12 8v8M9 11h6"/></svg>Knight</button>
        <button class="dm-tab" role="tab" type="button" data-tab="activities" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 19l5-12 4 7 3-4 4 9z"/><circle cx="17" cy="6" r="2"/></svg>Activities<i class="dm-dot hidden" id="dmActDot"></i></button>
        <button class="dm-tab" role="tab" type="button" data-tab="companions" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="8" cy="9" r="3"/><circle cx="16.5" cy="10" r="2.5"/><path d="M3 19c1-3 3-5 5-5s4 2 5 5M13 18c.6-2 2-3.5 3.5-3.5S20 16 21 18"/></svg>Companions</button>
    </nav>
</div>
