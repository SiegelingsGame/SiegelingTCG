<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Siegelings TCG</title>
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0a1530">
<meta name="apple-mobile-web-app-title" content="Siegelings">
<meta name="application-name" content="Siegelings">
<!-- Without these the installed app treats a full load of this page (the gacha
     return to /shop, a sign-in redirect) as an ordinary web page and wraps it
     in Safari's chrome, while /play - which carries them - stays fullscreen.
     black-translucent is safe here: --sg-sat feeds env(safe-area-inset-top)
     into every fixed header in home-redesign.css. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- style.css carries the real card frames, notches and rarity treatments the
     binder renders. It must load BEFORE home-redesign.css so the art-first
     palette and layout win where the two overlap. -->
<link rel="stylesheet" href="/css/style.css?v=269">
<link rel="stylesheet" href="/css/home-redesign.css?v=59">
<link rel="stylesheet" href="/css/install-guide.css?v=2">
<style>
  /* Boot state: the shell paints immediately on the app's own ground so the
     first frame is never a white flash while the catalog is in flight. */
  /* style.css sets body to a flex column on its own background; the shell
     needs its own ground and no competing flex context. */
  /* height:100% measured the layout viewport, so once iOS Safari hid its
     toolbar the shell stayed short and the tab bar stranded above a dead band.
     --sg-vh is the visible height (viewport-unit.js). */
  html, body { margin:0; background:#0d0a26 !important; display:block !important;
               height:var(--sg-vh, 100vh);
               /* See .sg-app in home-redesign.css: max() so an installed web app
                  whose dvh under-reports the glass still fills it. */
               height:max(100dvh, var(--sg-vh, 0px));
               overflow:hidden; font-family:inherit; }
  /* The boot screen was a spinner on a flat colour while the game already owns
     two libraries of artwork for exactly this moment. It now carries one piece
     from the gallery scenes plus the original site's loading library. */
  .boot { position:fixed; inset:0; z-index:80; background:#0d0a26;
          transition:opacity .4s ease; overflow:hidden; }
  .boot.gone { opacity:0; pointer-events:none; }
  .boot-plate { position:absolute; inset:0; background-size:cover; background-position:center;
                filter:saturate(1.15) brightness(.82); transform:scale(1.04);
                animation:bootDrift 18s ease-in-out infinite alternate; }
  .boot-veil { position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(13,10,38,.42) 0%, rgba(13,10,38,.20) 38%,
               rgba(13,10,38,.78) 78%, #0d0a26 100%); }
  .boot-foot { position:absolute; left:0; right:0; bottom:0;
    padding:0 22px calc(38px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; align-items:center; gap:13px; text-align:center; }
  /* Brand block: the icon alone left the boot screen unlabelled, so the
     wordmark rides with it. Column so it reads as one lockup on a phone. */
  .boot-brand { display:flex; flex-direction:column; align-items:center; gap:7px; }
  .boot-mark { width:52px; height:52px; border-radius:14px; }
  .boot-wordmark { font-size:19px; font-weight:800; letter-spacing:.20em;
                   text-transform:uppercase; color:#f4e6bd;
                   text-shadow:0 2px 14px rgba(0,0,0,.65); }
  .boot-wordmark span { display:block; margin-top:2px; font-size:9px; font-weight:600;
                        letter-spacing:.42em; color:#b3a8d8; }
  /* Filler copy: hints and lore rotate here so the wait teaches something.
     max-width keeps it to a readable measure on desktop; min-height stops the
     foot from jumping as lines of different length swap in. */
  .boot-hint { max-width:34em; min-height:3.2em; margin:0; font-size:13px; line-height:1.55;
               color:#d8d2f0; opacity:1; transition:opacity .3s ease; }
  .boot-hint.is-fading { opacity:0; }
  .boot-title { font-size:12px; letter-spacing:.30em; text-transform:uppercase;
                color:#e6cd8c; min-height:15px; }
  .boot-title::after { content:attr(data-place); display:block; margin-top:3px;
                       letter-spacing:.14em; text-transform:none; color:#b3a8d8; font-size:11px; }
  .boot-spin { width:28px; height:28px; border-radius:50%;
               border:2px solid rgba(180,140,255,.28); border-top-color:#ffd83d;
               animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes bootDrift { from { transform:scale(1.04) translateY(0); }
                         to   { transform:scale(1.10) translateY(-10px); } }
  @media (prefers-reduced-motion:reduce) {
    .boot-plate { animation:none; }
  }
</style>
    <!-- Sets --sg-vh before first paint; every fixed shell measures off it. -->
    <script src="/js/viewport-unit.js?v=3"></script>
</head>
<body>
<div class="boot" id="boot">
  <div class="boot-plate" data-art-plate></div>
  <div class="boot-veil"></div>
  <div class="boot-foot">
    <div class="boot-brand">
      <img class="boot-mark" src="/img/siegelings-icon.png" alt="">
      <div class="boot-wordmark">Siegelings<span>Trading Card Game</span></div>
    </div>
    <div class="boot-title" data-art-title></div>
    <p class="boot-hint" id="bootHint"></p>
    <span class="boot-spin"></span>
  </div>
</div>
<!-- game.js defines SieglingsCardShowcase, which card-binder-visual.js uses to
     compose a full card face. home.html loads the same pair for its binder. -->
<!-- Paints the boot plate before anything else runs, from the compiled-in
     gallery scenes plus whatever /api/art/loading cached on a previous visit. -->
<script src="/js/loading-art.js?v=3"></script>
<script>
  window.SiegelingsLoadingArt.paint(document.getElementById('boot'));
  window.sgStopBootHints = window.SiegelingsLoadingArt.mountHints(document.getElementById('bootHint'));
</script>
<script src="/js/game.js?v=302"></script>
<script src="/js/card-binder-visual.js?v=26"></script>
<script src="/js/home-redesign-data.js?v=1"></script>
<script src="/js/home-redesign.js?v=49"></script>
<script src="/js/home-redesign-live.js?v=11"></script>
<script src="/js/install-guide.js?v=2"></script>
<script>
(function () {
  // Path first (this page now answers /home, /cards, /decks, …), ?screen= as a
  // fallback so older links keep working.
  var screen = new URLSearchParams(location.search).get('screen')
    || window.SiegelingsHomeConcept.screenForPath(location.pathname)
    || 'home';
  var boot = document.getElementById('boot');

  function paint(live) {
    document.body.classList.add('single-screen');
    var opts = {
      screen: screen,
      live: live,
      guest: live ? live.guest : true,
      lobbies: live ? live.lobbies : null,
      siegeRuns: live ? live.siegeRuns : []
    };
    window.SiegelingsHomeConcept.mountApp(document.body, opts);
    boot.classList.add('gone');
    if (window.sgStopBootHints) window.sgStopBootHints();
    setTimeout(function () { boot.remove(); }, 450);
  }

  // The catalog is the only slice worth waiting on; everything else the
  // renderer can do without. A failure still paints, on the snapshot.
  window.SiegelingsHomeLive.load().then(paint).catch(function () { paint(null); });
  // Extends the rotation with the original site's loading library for next time.
  window.SiegelingsLoadingArt.refresh();
})();
</script>
</body>
</html>
