<!DOCTYPE html><html><head><meta charset="utf-8"><title>chain order</title>
<link rel="stylesheet" href="/css/style.css?v=232"></head><body>
<div id="enemyGrid"></div><div id="playerGrid"></div>
<script>
for (const id of ['enemyGrid','playerGrid']) {
  const g = document.getElementById(id);
  for (let r=0;r<3;r++) for (let c=0;c<3;c++) {
    const cell=document.createElement('div');
    cell.className='board-cell'; cell.dataset.row=r; cell.dataset.col=c;
    cell.innerHTML='<div class="board-card"></div>';
    g.appendChild(cell);
  }
}
window.__fxLog = [];
window.SieglingsFx = {
  attackCell: (sp,sr,sc,tp,tr,tc)=>window.__fxLog.push({t:Math.round(performance.now()),
    from:sp+':'+sr+','+sc, to:tp+':'+tr+','+tc}),
  cameraShake: ()=>{}, impact: ()=>{}, burst: ()=>{}
};
</script>
<script src="/js/action-queue.js?v=45"></script>
</body></html>
