spring.application.name=Sieglings TCG
# Optional gitignored overrides (copy application-local.properties.example).
spring.config.import=optional:file:./application-local.properties
server.port=${PORT:8080}
# Comma-separated list of frontend origins allowed to call the API when the
# static UI is hosted separately (for example on Firebase Hosting).
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,https://siegelingstcgtesting.web.app,https://siegelingstcgtesting.firebaseapp.com
# User data (accounts, sessions, saved decks, match history) lives in Firestore.
# Defaults inherit from the card-editor Firestore config below so a single project/database
# powers the whole API. Override with app.user-data.* to point user data elsewhere.
# When true, creates demo@local.test / demo12345 on startup if missing (BCrypt-hashed).
app.seed-demo-user=false
# Optional owner recovery code for /api/auth/reset-password. Leave blank to disable password reset.
app.auth.password-reset-code=
app.card-editor.firestore-project-id=siegelingstcgtesting
app.card-editor.firestore-database-id=siegedb
app.card-editor.firestore-collection=appConfig
app.card-editor.firestore-document=cardOverrides
app.card-editor.firestore-live-elements-document=liveElements
# Empty = use Application Default Credentials (recommended local). Set a path only if you use a JSON key file.
app.card-editor.firestore-service-account-path=
# Backstop leaderboard snapshot refresh (Spring cron: second minute hour day month weekday).
# Freshness is primarily driven by app.leaderboard.refresh-ttl-ms below; this cron just
# guarantees a periodic rebuild even with no traffic.
app.leaderboard.refresh-cron=0 0 7 * * *
app.leaderboard.time-zone=UTC
# Max age of a built snapshot before the next read rebuilds it (milliseconds). This is what
# lets matches played today appear on the daily board within a couple of minutes. Set to 0
# to rely solely on the cron above.
app.leaderboard.refresh-ttl-ms=120000
